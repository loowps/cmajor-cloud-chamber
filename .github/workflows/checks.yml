name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Version stamped into the built patch manifest
        type: string
        default: ''

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CMAJOR_VERSION: 1.0.3175

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build patch
    # cmaj links against libwebkit2gtk-4.0, which Ubuntu dropped after 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Stamp version into manifest
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('node:fs')
            const file = 'dist/CloudChamber.cmajorpatch'
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
            manifest.version = process.env.VERSION
            fs.writeFileSync(file, JSON.stringify(manifest, null, 4) + '\n')
          "

      - name: Install Cmajor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2 libjack-jackd2-0 libgtk-3-0 libwebkit2gtk-4.0-37
          curl -fsSL -o "$RUNNER_TEMP/cmajor.zip" \
            "https://github.com/cmajor-lang/cmajor/releases/download/${CMAJOR_VERSION}/cmajor.linux.x64.zip"
          unzip -q "$RUNNER_TEMP/cmajor.zip" -d "$RUNNER_TEMP/cmajor"
          cmaj="$(find "$RUNNER_TEMP/cmajor" -type f -name cmaj -print -quit)"
          if [ -z "$cmaj" ]; then
            echo "::error::No cmaj executable in the Cmajor archive"
            find "$RUNNER_TEMP/cmajor" -maxdepth 3
            exit 1
          fi
          chmod +x "$cmaj"
          missing="$(ldd "$cmaj" | grep 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "::error::cmaj is missing shared libraries"
            echo "$missing"
            exit 1
          fi
          echo "$(dirname "$cmaj")" >> "$GITHUB_PATH"

      # cmaj reports compile errors but still exits 0, so its output has to be inspected.
      - name: Compile DSP
        run: |
          cmaj version
          cmaj play --no-gui --dry-run --stop-on-error dist/CloudChamber.cmajorpatch 2>&1 | tee cmaj.log
          if grep -q ': error:' cmaj.log; then exit 1; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-chamber-patch
          path: dist/
          retention-days: 7
